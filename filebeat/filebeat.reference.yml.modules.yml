# --------------- inputs 用于获取数据等输入列表
filebeat:inputs:
- type: log                 # log 类型
  enabled: false             # 当前input是否开启
  paths:
    - /var/log/*.log
  encoding: utf-8
  exclude_lines: ['^debug']
  include_lines: ['^ERR']
  exclude_files: ['.gz$']
  file_identity.native: ~
  fields:   # 附加字段，输入实例级别可选自定义配置。
    level: debug
    custom: true
  fields_under_root: false  # 附加字段是否存储为顶级字段
  keep_null: false          # 设置为true 以在事件中发布具有空置的字段
  publisher_pipeline.disable_host: false  # 禁用host.name 字段
  ignore_older: 0           # 忽略过去修改时间超过定义时间跨度的文件，0 表示不会忽略，2h 5m等取值有效
  scan_frequency: 10s       # filebeat 扫描路径中新文件等频率,默认10s
  harvester_buffer_size: 16384  # 每个收集器获取文件时的缓冲区大小
  max_bytes: 10485760       # 单个日志事件的最大字节数,超出的部分会被丢弃不会发送，默认10MB
  line_terminator: auto     # 行分隔符
  # === 递归全局配置
  #recursive_glob.enabled: true # 将“**”模式扩展为常规的 glob 模式。
  # === json配置
  #json.message_key:        # 解码 JSON 选项。如果您的日志采用 JSON 结构，请启用此选项。
  # ...
- type: filestream        # filestream 类型
  id: my-filestream-id    # 所有输入中的唯一 ID，ID 是必需的。
  enabled: false          # 是否启用
  paths:
    - /var/log/*.log
  encoding: utf-8
  #exclude_lines: ['^DEB']
  #include_lines: ['^DEB']
  #...
- type: stdin
  enabled: false
  # ...
- type: redis
  enabled: false
  # ...
- type: udp
  enabled: false
  # ...
- type: tcp
  enabled: false
  # ...
- type: syslog
  enabled: false
  # ...
- type: container
  enabled: false
  # ...

